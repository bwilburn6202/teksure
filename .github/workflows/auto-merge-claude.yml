name: Auto-merge Claude & bot branches

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  auto-merge:
    # A PR whose title contains [hold], or that carries the "hold" label, is left
    # for a human to merge. Use it for changes that remove content or need review.
    if: |
      (startsWith(github.head_ref, 'claude/') ||
       startsWith(github.head_ref, 'codex/') ||
       startsWith(github.head_ref, 'vercel/')) &&
      !contains(github.event.pull_request.title, '[hold]') &&
      !contains(github.event.pull_request.labels.*.name, 'hold')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Mark draft as ready-for-review (if needed)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        if: ${{ github.event.pull_request.draft == true }}
        run: |
          gh pr ready "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}"

      - name: Squash-merge and delete branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr merge "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}" \
            --squash \
            --delete-branch
