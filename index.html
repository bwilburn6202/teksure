      // picked dark via the DarkModeToggle. A welcoming light surface is
      // friendlier for first-time seniors/beginners than a dark starfield.
      // Mirrors RouteThemeDefault in App.tsx.

        try {
          var stored = localStorage.getItem('teksure-theme');
          if (stored === 'dark') {
            document.documentElement.classList.add('dark');
          }
        } catch (_) { /* no-op */ }

      Prerender injects this route's real title, description, canonical and

      until 2026-08-20, which put every prerendered page's title, canonical and

      obliged to read them. The prerender report still said
      renderedWithoutTitle: 0 because that check only looked for a title tag
      anywhere in the document, not for one inside the head.

      Do not write literal tag markup in this comment: buildHtml strips the
      shell's existing title/meta by regex over the whole file, and a

    <script>

          }).catch(() => {
